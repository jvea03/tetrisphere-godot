// Egg Escape's local notifications, as a Godot v2 Android plugin. Built into
// addons/EggNotify/bin/ by tools/build_notify_plugin.ps1, compiled against the
// godot-lib in the installed Android build template (android/build/libs).
plugins {
    id 'com.android.library' version '8.6.1'
}

android {
    namespace 'com.jvea.eggnotify'
    compileSdk 36
    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files('../../android/build/libs/release/godot-lib.template_release.aar')
}
